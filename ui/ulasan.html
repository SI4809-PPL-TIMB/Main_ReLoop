<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reloop · Tulis Ulasan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 500: '#15803d', 600: '#166534' },
            loop: { DEFAULT: '#e8f5e9', soft: '#f0fdf4', dark: '#15803d' },
            ink: '#0f172a'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased">
  <div class="relative mx-auto min-h-screen max-w-[420px] bg-white pb-28 shadow-sm">
    <!-- Header -->
    <header class="sticky top-0 z-20 flex items-center gap-3 bg-white px-4 py-4">
      <a href="pesanan.html" aria-label="Kembali" class="grid size-10 place-items-center rounded-full border border-slate-200 hover:bg-slate-50 transition">
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </a>
    </header>

    <main class="px-4 pt-1">
      <!-- Kartu Info Pesanan / Penjual -->
      <section class="flex items-center gap-3 rounded-2xl border border-slate-200 p-3.5 bg-white">
        <div class="size-12 shrink-0 overflow-hidden rounded-xl border border-slate-100 bg-slate-50 flex items-center justify-center text-slate-300">
          <svg class="size-6 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </div>
        <div class="min-w-0 flex-1">
          <p class="truncate font-bold text-sm text-ink">Bank Sampah Hijau Lestari</p>
          <p class="text-xs text-slate-400 mt-0.5">Setoran selesai · 22 Okt</p>
        </div>
      </section>

      <!-- Form Ulasan -->
      <form id="form-ulasan" class="mt-6 space-y-6">
        <!-- Bintang Rating 1-5 -->
        <div class="text-center pt-2">
          <label class="block text-sm font-bold text-ink">Bagaimana pengalamanmu?</label>

          <div class="mt-3 flex justify-center gap-2 text-4xl text-slate-200" id="star-container">
            <button type="button" data-star="1" class="star-btn transition hover:scale-110 focus:outline-none" aria-label="1 Bintang">★</button>
            <button type="button" data-star="2" class="star-btn transition hover:scale-110 focus:outline-none" aria-label="2 Bintang">★</button>
            <button type="button" data-star="3" class="star-btn transition hover:scale-110 focus:outline-none" aria-label="3 Bintang">★</button>
            <button type="button" data-star="4" class="star-btn transition hover:scale-110 focus:outline-none" aria-label="4 Bintang">★</button>
            <button type="button" data-star="5" class="star-btn transition hover:scale-110 focus:outline-none" aria-label="5 Bintang">★</button>
          </div>
          <input type="hidden" name="rating" id="rating-val" value="">
          <p id="rating-label" class="mt-2 text-sm font-bold text-ink">Pilih bintang</p>
        </div>

        <!-- Chips: Yang kamu suka -->
        <div>
          <label class="block text-sm font-bold text-ink mb-2.5">Yang kamu suka</label>
          <div class="flex flex-wrap gap-2" id="chips-container">
            <button type="button" class="tag-chip rounded-full bg-ink border border-ink px-4 py-2 text-xs font-semibold text-white transition">Tepat waktu</button>
            <button type="button" class="tag-chip rounded-full bg-ink border border-ink px-4 py-2 text-xs font-semibold text-white transition">Timbangan jujur</button>
            <button type="button" class="tag-chip rounded-full border border-slate-200 px-4 py-2 text-xs font-semibold text-slate-700 transition hover:bg-slate-50">Ramah</button>
            <button type="button" class="tag-chip rounded-full border border-slate-200 px-4 py-2 text-xs font-semibold text-slate-700 transition hover:bg-slate-50">Harga sesuai</button>
          </div>
        </div>

        <!-- Kolom Ulasan Teks -->
        <div>
          <label for="review-body" class="block text-sm font-bold text-ink mb-2">Ulasan</label>
          <textarea id="review-body" name="body" rows="4" maxlength="500"
            placeholder="Ceritakan pengalamanmu (opsional)"
            class="w-full rounded-2xl border border-slate-200 p-3.5 text-sm outline-none transition focus:border-slate-400 focus:ring-0"></textarea>
        </div>

        <!-- Foto (opsional) -->
        <div>
          <label class="block text-sm font-bold text-ink mb-2">Foto <span class="font-normal text-xs text-slate-400">(opsional)</span></label>
          <div class="flex items-center">
            <div class="flex size-16 cursor-pointer items-center justify-center rounded-2xl border-2 border-dashed border-slate-200 text-slate-300 hover:border-slate-300 hover:text-slate-400 transition">
              <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            </div>
          </div>
        </div>

        <!-- Catatan disclaimer -->
        <p class="text-xs text-slate-400 pt-1">
          Ulasan hanya bisa diberikan sekali dan tidak bisa diubah.
        </p>

        <!-- Tombol Kirim (Fixed di Bawah) -->
        <div class="fixed inset-x-0 bottom-0 z-30 mx-auto w-full max-w-[420px] border-t border-slate-200 bg-white px-4 pb-[max(14px,env(safe-area-inset-bottom))] pt-3 shadow-[0_-2px_8px_rgba(0,0,0,0.03)]">
          <button type="submit" id="btn-submit" class="block w-full rounded-full bg-ink py-3.5 text-center font-semibold text-white transition hover:bg-slate-800 active:scale-95">
            Kirim ulasan
          </button>
        </div>
      </form>
    </main>
  </div>

  <script>
    const stars = document.querySelectorAll('.star-btn');
    const ratingVal = document.getElementById('rating-val');
    const ratingLabel = document.getElementById('rating-label');
    const tagChips = document.querySelectorAll('.tag-chip');

    const LABELS = {
      1: 'Sangat Mengecewakan',
      2: 'Kurang Puas',
      3: 'Cukup Baik',
      4: 'Memuaskan',
      5: 'Sempurna'
    };

    function setRating(val) {
      ratingVal.value = val;
      ratingLabel.textContent = LABELS[val] || 'Pilih bintang';
      stars.forEach((btn, idx) => {
        if (idx < val) {
          btn.classList.add('text-amber-400');
          btn.classList.remove('text-slate-200');
        } else {
          btn.classList.remove('text-amber-400');
          btn.classList.add('text-slate-200');
        }
      });
    }

    stars.forEach(btn => {
      btn.addEventListener('click', () => {
        setRating(parseInt(btn.dataset.star));
      });
    });

    tagChips.forEach(chip => {
      chip.addEventListener('click', () => {
        const isSelected = chip.classList.contains('bg-ink');
        if (isSelected) {
          chip.classList.remove('bg-ink', 'text-white', 'border-ink');
          chip.classList.add('border-slate-200', 'text-slate-700');
        } else {
          chip.classList.remove('border-slate-200', 'text-slate-700');
          chip.classList.add('bg-ink', 'text-white', 'border-ink');
        }
      });
    });
  </script>
</body>
</html>
